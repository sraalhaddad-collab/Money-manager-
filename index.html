function render(){const t=total(),spent=monthTx().reduce((a,x)=>a+Number(x.amount),0);$('month-label').textContent=monthName();$('activity-month-label').textContent=monthName();$('remaining').textContent=fmt(t-spent);$('spent').textContent=fmt(spent);$('budget').textContent=fmt(t);$('overallbar').style.width=(t?Math.min(100,spent/t*100):0)+'%';$('edit').innerHTML=svgSettings;$('edit-start').classList.toggle('hidden',editing);$('edit-actions').classList.toggle('hidden',!editing);$('categories').replaceChildren();state.categories.slice().sort((a,b)=>({subscriptions:'Books',groceries:'Bread',pets:'Cat',charity:'Dove',food:'Hamburger',mobile:'Mobile Phone',fuel:'Oncoming Automobile',luxury:'Shopping Bags'}[a.id]||a.name).localeCompare(({subscriptions:'Books',groceries:'Bread',pets:'Cat',charity:'Dove',food:'Hamburger',mobile:'Mobile Phone',fuel:'Oncoming Automobile',luxury:'Shopping Bags'}[b.id]||b.name))).forEach(c=>{const s=used(c.id),div=document.createElement('div');div.className='category';const top=document.createElement('div');top.className='split';const icon=document.createElement('span');icon.className='emoji';icon.textContent=c.icon;const balance=document.createElement('span');balance.className='balance'+(c.budget-s<0?' negative':'');balance.textContent=fmt(c.budget-s);top.append(icon,balance);const sub=document.createElement('div');sub.className='sub';sub.textContent=`${fmt(s)} of ${fmt(c.budget)}`;const bar=document.createElement('div');bar.className='track';const fill=document.createElement('div');fill.style.width=(c.budget?Math.min(100,s/c.budget*100):0)+'%';if(s>c.budget)fill.style.background='#b73535';bar.append(fill);div.append(top,sub,bar);if(editing){const row=document.createElement('div');row.className='budget-edit';const label=document.createElement('span');label.textContent='';const inp=document.createElement('input');inp.className='field-input';inp.type='number';inp.min='0';inp.step='.01';inp.value=draftBudgets[c.id]??c.budget;inp.setAttribute('aria-label',c.name+' budget');inp.oninput=()=>{draftBudgets[c.id]=inp.value};row.append(label,inp);div.append(row)}else{div.classList.add('clickable');div.tabIndex=0;div.setAttribute('role','button');div.setAttribute('aria-label','Add expense for '+c.name);div.onclick=()=>openExpense(c.id);div.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openExpense(c.id)}}}$('categories').append(div)});$('transactions').replaceChildren();monthTx().slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>{const row=document.createElement('div');row.className='transaction';const left=document.createElement('div');const title=document.createElement('strong');title.textContent=fmt(x.amount);const meta=document.createElement('div');meta.className='meta';const [y,m,d]=x.date.split('-');meta.textContent=`${state.categories.find(c=>c.id===x.category)?.icon||'•'} · ${Number(d)} / ${Number(m)} / ${y}`;left.append(title,meta);const right=document.createElement('div');right.className='right';const val=document.createElement('strong');val.textContent='';const del=document.createElement('div');const btn=document.createElement('button');btn.className='square';btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12H20"/></svg>';btn.setAttribute('aria-label','Remove expense');btn.onclick=()=>{if(confirm('Delete this expense?')){state.transactions=state.transactions.filter(t=>t.id!==x.id);save();render()}};del.append(btn);right.append(del);row.append(left,right);$('transactions').append(row)})}
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>changeMonth(Number(b.dataset.move)));$('edit').onclick=()=>{editing=true;draftBudgets=Object.fromEntries(state.categories.map(c=>[c.id,String(c.budget)]));render()};$('cancel-budgets').onclick=()=>{editing=false;draftBudgets={};render()};$('save-budgets').onclick=()=>{const values=state.categories.map(c=>Number(draftBudgets[c.id]));if(values.some(v=>!Number.isFinite(v)||v<0)){alert('Enter valid budget amounts');return;}state.categories.forEach((c,i)=>c.budget=Math.round(values[i]*100)/100);save();editing=false;draftBudgets={};render()};$('date').onchange=dateLabel;$('cancel').onclick=()=>show('home');$('homebtn').onclick=()=>show('home');$('activitybtn').onclick=()=>show('activity');$('expenseform').onsubmit=e=>{e.preventDefault();const a=Number($('amount').value),date=$('date').value;if(!Number.isFinite(a)||a<=0||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)){alert('Enter a valid amount and date');return}state.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),category:selectedCategory,amount:Math.round(a*100)/100,note:'Expense',date});selectedMonth=date.slice(0,7);save();show('home')};
let assetEditId=null,assetType='savings';
function renderAssets(){
 $('reserves-total').textContent=fmt(state.savings.reduce((n,x)=>n+Number(x.amount),0));
 $('debt-total').textContent=fmt(state.receivables.reduce((n,x)=>n+Math.max(0,Number(x.amount)-Number(x.repaid||0)),0));
 for(const [type,target] of [['savings','reserves-list'],['receivables','debt-list']]){
  const root=$(target);root.replaceChildren();
  state[type].forEach(item=>{
   const row=document.createElement('div');row.className='asset-item asset-group';
   const info=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name;
   const amt=document.createElement('div');amt.className='muted';amt.textContent=fmt(type==='savings'?item.amount:Math.max(0,item.amount-(item.repaid||0)));
   info.append(name,amt);const actions=document.createElement('div');
   const del=document.createElement('button');del.className='asset-small asset-remove-icon';del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12H20"/></svg>';del.setAttribute('aria-label','Remove entry');del.onclick=e=>{e.stopPropagation();if(confirm('Delete this entry?')){state[type]=state[type].filter(x=>x.id!==item.id);save();renderAssets()}};
   info.classList.add('asset-info');info.tabIndex=0;info.setAttribute('role','button');info.setAttribute('aria-label','Edit '+(type==='savings'?'reserve':'debt'));info.onclick=()=>openAsset(type,item);info.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openAsset(type,item)}};
   row.onclick=e=>{if(!e.target.closest('button')&&!e.target.closest('.asset-info'))openAsset(type,item)};
   actions.append(del);row.append(info,actions);root.append(row);
  });
 }
}
function openAsset(type,item=null){assetType=type;assetEditId=item?.id??null;
 if(type==='savings'){$('reserve-amount').value=item?.amount??'';$('reserve-description').value=item?.name??'';$('reserve-editor').classList.remove('hidden')}
 else{$('debt-name').value=item?.name??'';$('debt-amount').value=item?Math.max(0,Number(item.amount)-Number(item.repaid||0)):'';$('debt-editor').classList.remove('hidden')}
}
$('add-reserve').onclick=()=>openAsset('savings');$('add-debt').onclick=()=>openAsset('receivables');
$('reserve-cancel').onclick=()=>$('reserve-editor').classList.add('hidden');$('debt-cancel').onclick=()=>$('debt-editor').classList.add('hidden');
function storeAsset(type,name,amount,repaid=0){if(!name||amount===''||!Number.isFinite(+amount)||+amount<0||!Number.isFinite(+repaid)||+repaid<0||+repaid>+amount){alert('Please enter valid details.');return false}const item={id:assetEditId??String(Date.now())+Math.random(),name,amount:Math.round(+amount*100)/100,repaid:Math.round(+repaid*100)/100};if(assetEditId!==null)state[type]=state[type].map(x=>x.id===assetEditId?item:x);else state[type].push(item);save();renderAssets();return true}
$('reserve-save').onclick=()=>{if(storeAsset('savings',$('reserve-description').value.trim(),$('reserve-amount').value))$('reserve-editor').classList.add('hidden')};
$('debt-save').onclick=()=>{if(storeAsset('receivables',$('debt-name').value.trim()||'Debt',$('debt-amount').value,0))$('debt-editor').classList.add('hidden')};
$('reservesbtn').onclick=()=>show('reserves');$('debtbtn').onclick=()=>show('debt');
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});show('home');
</script></body></html>
